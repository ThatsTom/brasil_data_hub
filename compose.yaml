services:
  postgres:
    image: postgres:17-alpine
    container_name: brasil-data-hub-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: brasil_data_hub
      POSTGRES_USER: brasil_hub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brasil_hub -d brasil_data_hub"]
      interval: 5s
      timeout: 3s
      retries: 15

volumes:
  postgres_data: